# Activer avec --spring.profiles.active=prod. Aucun secret par defaut.
spring.datasource.url=${SIRH_DB_URL}
spring.datasource.username=${SIRH_DB_USER}
spring.datasource.password=${SIRH_DB_PASSWORD}
app.jwt.secret=${SIRH_JWT_SECRET}
app.jwt.cookie-secure=true
app.jwt.expiration-minutes=60
app.demo-data.enabled=false
logging.level.com.sirh=INFO
app.schema-migrations.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
