# ============================================================================
# SIRH — Gestion RH
# ============================================================================

spring.application.name=sirh

# --- Base de données PostgreSQL ---
# Exécuter au préalable sql/01_schema.sql puis sql/02_seed.sql (voir docs/INSTALLATION.md)
spring.datasource.url=jdbc:postgresql://localhost:5432/sirh
spring.datasource.username=postgres
spring.datasource.password=d3ll
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- Vues JSP ---
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# --- Encodage des requêtes ---
# Sans "force", le filtre d'encodage de Spring Boot ne s'applique qu'en l'absence d'un
# Content-Type/charset déjà présent sur la requête : un POST de formulaire JSP classique
# (application/x-www-form-urlencoded, sans charset explicite) retombait alors sur l'ISO-8859-1
# par défaut du conteneur, corrompant tout texte accentué saisi (ex. "l'équipe" -> "l'�quipe").
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# --- Upload de fichiers (CV) ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=uploads/
app.upload.cv.extensions-autorisees=pdf

# --- JWT ---
# IMPORTANT : à surcharger en production (variable d'environnement SIRH_JWT_SECRET), ne jamais garder
# cette valeur par défaut en prod. Doit faire au moins 256 bits (32 caractères) pour HS256.
app.jwt.secret=${SIRH_JWT_SECRET:changez-cette-cle-secrete-en-production-min-32-car}
app.jwt.expiration-minutes=480
app.jwt.cookie-name=sirh_jwt
# A mettre a true en production (HTTPS) ; false en dev local (HTTP)
app.jwt.cookie-secure=false

# --- Circuit des demandes internes ---
app.demande.delai-execution-jours-defaut=7

# --- Jeu de données de démonstration (comptes DG/RH/etc. créés au démarrage) ---
# A mettre à false en production.
app.demo-data.enabled=true

# --- Logs ---
logging.level.com.sirh=DEBUG
